name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - uses: erlef/setup-beam@v1
        env:
          # setup-beam uses ImageOS to select an OTP build compatible with
          # the runner's OpenSSL version. act may otherwise report ubuntu20.
          ImageOS: ubuntu24
        with:
          otp-version: "28"
          gleam-version: "1.17.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: gleam run -m intldate_generate
      - run: gleam run --target javascript -m intldate_test_data
      - run: gleam test --target=javascript
      - run: gleam test --target=erlang
      - run: gleam format --check src test
